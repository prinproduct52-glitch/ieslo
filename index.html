<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAISENTZ TOPUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e; /* ពណ៌ខៀវងងឹតបែប 3D */
            --card-bg: #16213e;
            --primary: #e94560; /* ពណ៌លេចធ្លោ (ក្រហមផ្កាឈូក) */
            --text-light: #ffffff;
            --text-muted: #8b92a5;
        }
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-light); 
            padding-bottom: 90px;
        }
        
        /* Header 3D */
        .header { 
            background: linear-gradient(145deg, #18182b, #1c1c31);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .header img {
            height: 45px;
            margin-right: 12px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
        }
        .header h1 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700; 
            color: var(--text-light); 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .back-btn {
            position: absolute;
            left: 15px;
            background: linear-gradient(145deg, #1c2645, #141c33);
            box-shadow: 3px 3px 6px #0d1222, -3px -3px 6px #212c50;
            border: none;
            color: var(--text-light);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: none; /* លាក់សិន វានឹងបង្ហាញពេលចូលមើល Package */
            font-family: 'Kantumruy Pro', sans-serif;
            font-weight: 600;
        }
        .back-btn:active {
            box-shadow: inset 3px 3px 6px #0d1222, inset -3px -3px 6px #212c50;
        }
        
        /* ហ្គេម (Home View) */
        .home-container {
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-card {
            background: linear-gradient(145deg, #182442, #141e37);
            box-shadow: 8px 8px 16px #0b111e, -8px -8px 16px #21315a;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:active {
            transform: translateY(4px);
            box-shadow: inset 5px 5px 10px #0b111e, inset -5px -5px 10px #21315a;
        }
        .game-card img {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .game-card h2 { margin: 0; font-size: 22px; color: var(--text-light); }

        /* បញ្ជីសេវាកម្ម (Package View) */
        .package-container {
            display: none; /* លាក់សិន */
            padding: 20px; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
        }
        .package-item { 
            background: linear-gradient(145deg, #182442, #141e37);
            box-shadow: 5px 5px 10px #0b111e, -5px -5px 10px #21315a;
            border-radius: 15px; 
            padding: 15px;
            display: flex; 
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .pkg-icon {
            font-size: 35px;
            margin-bottom: 10px;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.4));
        }
        .pkg-title { font-size: 16px; margin: 0 0 5px; font-weight: 700; color: #fff;}
        .pkg-price { color: var(--primary); font-weight: 700; font-size: 18px; margin-bottom: 15px; }
        
        /* ប៊ូតុង 3D */
        .btn-3d { 
            background: linear-gradient(145deg, #1c2645, #141c33);
            box-shadow: 3px 3px 8px #0d1222, -3px -3px 8px #212c50;
            color: var(--primary); 
            border: none; 
            padding: 10px; 
            width: 100%; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700;
            font-family: 'Kantumruy Pro', sans-serif;
            transition: all 0.1s;
        }
        .btn-3d:active { 
            box-shadow: inset 3px 3px 6px #0d1222, inset -3px -3px 6px #212c50;
            color: #fff;
        }
        
        /* កន្ត្រកទំនិញ (Cart Bottom Bar) */
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: linear-gradient(145deg, #1a1a2e, #131322);
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            padding: 15px 20px; 
            box-sizing: border-box; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .cart-bar.show { transform: translateY(0); }
        .cart-total { display: flex; flex-direction: column; }
        .cart-total span { font-size: 12px; color: var(--text-muted); }
        .cart-total strong { color: var(--primary); font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        
        .checkout-btn { 
            background: linear-gradient(145deg, #f94a67, #d23e56);
            box-shadow: 4px 4px 10px #0b111e, -2px -2px 5px #2a375e;
            color: #fff; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 25px; 
            font-weight: 700; 
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        .checkout-btn:active {
            box-shadow: inset 4px 4px 10px #8c293a, inset -4px -4px 10px #ff617e;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" id="backBtn" onclick="goBack()">ត្រឡប់</button>
        <img src="https://img.sanishtech.com/u/5322da98db8de164b44bde759003c5d0.png" alt="KAISENTZ Logo">
        <h1>KAISENTZ</h1>
    </div>
    
    <!-- ទំព័រជ្រើសរើសហ្គេម -->
    <div class="home-container" id="homeView">
        <div class="game-card" onclick="showPackages()">
            <img src="https://img.sanishtech.com/u/9ebcfb0522c1660037edd5f764a1669a.png" alt="Mobile KH">
            <h2>Mobile KH</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">ចុចដើម្បីជ្រើសរើសកញ្ចប់</p>
        </div>
    </div>

    <!-- ទំព័រ Package កុម្ម៉ង់ -->
    <div class="package-container" id="packageView">
        <!-- ទិន្នន័យ Package នឹងត្រូវ Render ទីនេះ -->
    </div>

    <!-- កន្ត្រកខាងក្រោម -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-total">
            <span>តម្លៃសរុប:</span>
            <strong id="totalPrice">$0.00</strong>
        </div>
        <button class="checkout-btn" onclick="checkout()">
            ទិញឥឡូវនេះ (<span id="cartCount">0</span>)
        </button>
    </div>

    <script>
        // ទិន្នន័យកញ្ចប់ Topup របស់ Mobile KH
        const products = [
            { id: 1, name: '86 Diamonds', price: 1.00, icon: '💎' },
            { id: 2, name: '172 Diamonds', price: 2.00, icon: '💎' },
            { id: 3, name: '257 Diamonds', price: 3.00, icon: '💎' },
            { id: 4, name: '706 Diamonds', price: 8.00, icon: '💎' },
            { id: 5, name: 'Weekly Pass', price: 1.80, icon: '🎟️' },
            { id: 6, name: 'Twilight Pass', price: 9.50, icon: '🌟' }
        ];

        let cart = [];

        // បង្ហាញបញ្ជី Package
        function renderMenu() {
            const packageView = document.getElementById('packageView');
            packageView.innerHTML = '';
            products.forEach(p => {
                packageView.innerHTML += `
                    <div class="package-item">
                        <div class="pkg-icon">${p.icon}</div>
                        <h3 class="pkg-title">${p.name}</h3>
                        <div class="pkg-price">$${p.price.toFixed(2)}</div>
                        <button class="btn-3d" onclick="addToCart(${p.id})">បន្ថែម +</button>
                    </div>
                `;
            });
        }

        // ការបញ្ជាផ្លាស់ប្តូរទំព័រ (Navigation)
        function showPackages() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('packageView').style.display = 'grid';
            document.getElementById('backBtn').style.display = 'block';
        }

        function goBack() {
            document.getElementById('packageView').style.display = 'none';
            document.getElementById('homeView').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
        }

        // មុខងារកន្ត្រក
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            document.getElementById('cartCount').innerText = cart.length;
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;

            if(cart.length > 0) {
                cartBar.classList.add('show');
            } else {
                cartBar.classList.remove('show');
            }
        }

        function checkout() {
            if(cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            alert(`✅ ការបញ្ជាទិញទទួលបានជោគជ័យ!\nសរុបទឹកប្រាក់: $${total.toFixed(2)}\n\nសូមផ្ញើវិក្កយបត្រនេះទៅកាន់ Admin តាមរយៈ Telegram!`);
            
            cart = [];
            updateCartUI();
        }

        // ដំឡើងទិន្នន័យដំបូង
        renderMenu();
    </script>
</body>
</html>
