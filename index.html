<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Service - Mini App Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
            --shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-pill {
            background: #21262d;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-icon:hover {
            background: #30363d;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .empty-card {
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .empty-icon {
            font-size: 40px;
            color: #58a6ff;
            margin-bottom: 15px;
        }

        .empty-card h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .empty-card p {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .primary-btn {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.4);
            transition: 0.2s;
        }

        .primary-btn:hover {
            background-color: #388bfd;
        }

        /* Modal Popup សម្រាប់ Login / Register */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 80%;
            max-width: 320px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            text-align: left;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #8b949e;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0d1117;
            color: var(--text-color);
            box-sizing: border-box;
        }

        /* Admin Dashboard & Code Editor Panel */
        .dashboard-panel {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            text-align: left;
        }

        .dashboard-panel.active {
            display: flex;
        }

        .dashboard-header {
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-container {
            flex: 1;
            background: #090d16;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #7ee787;
            border: none;
            resize: none;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ផ្នែក Home ធម្មតា (មុនពេល Login) -->
        <div id="homeView" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
            <header>
                <div class="brand-pill">Delta Service &gt;</div>
                <div class="header-actions">
                    <button class="btn-icon"><i class="fa-solid fa-shield-halved"></i> G</button>
                    <button class="btn-icon" onclick="openModal()"><i class="fa-solid fa-user-plus"></i></button>
                </div>
            </header>

            <div class="content">
                <div class="empty-card">
                    <div class="empty-icon"><i class="fa-solid fa-cube"></i></div>
                    <h3>មិនទាន់មាន Mini App នៅឡើយទេ</h3>
                    <p>បង្កើត Mini App ផ្ទាល់ខ្លួនរបស់អ្នក រួចចត Share ដើម្បីធ្វើ Link ឲ្យមិត្តភក្តិប្រើប្រាស់!</p>
                    <button class="primary-btn" onclick="openModal()">+ បង្កើត Mini App ដំបូង</button>
                </div>
            </div>
        </div>

        <!-- ផ្នែក Admin Dashboard & Code Editor (បន្ទាប់ពី Login រួច) -->
        <div id="dashboardView" class="dashboard-panel">
            <div class="dashboard-header">
                <div><strong>Admin Dashboard</strong> <span style="font-size: 11px; color: #238636; background: #21262d; padding: 2px 6px; border-radius: 4px;">Free Plan</span></div>
                <button class="btn-icon" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ចាកចេញ</button>
            </div>
            <div style="padding: 10px 15px; background: #161b22; font-size: 12px; border-bottom: 1px solid var(--border-color);">
                🎛️ កែសម្រួលកូដ Mini App របស់អ្នកនៅទីនេះ៖
            </div>
            <textarea class="editor-container">&lt;!-- សរសេរ HTML/CSS កូដ Mini App របស់អ្នកនៅទីនេះ --&gt;
&lt;div style="text-align:center; padding:50px;"&gt;
    &lt;h2&gt;Welcome to My Mini App!&lt;h2&gt;
    &lt;p&gt;កែសម្រួលដោយ Admin&lt;/p&gt;
&lt;/div&gt;</textarea>
            <div style="padding: 10px; background: var(--card-bg); border-top: 1px solid var(--border-color);">
                <button class="primary-btn" style="background-color: var(--accent-color);" onclick="alert('បានរក្សារទុកកូដដោយជោគជ័យ!')">💾 រក្សារទុកកូដ (Save)</button>
            </div>
        </div>

        <!-- Popup សម្រាប់ Login / Register Account -->
        <div class="modal" id="authModal">
            <div class="modal-content">
                <h3>បង្កើត Account / Login</h3>
                <div class="form-group">
                    <label>អ៊ីមែល ឬ ឈ្មោះគណនី</label>
                    <input type="text" id="username" placeholder="បញ្ចូលឈ្មោះ...">
                </div>
                <div class="form-group">
                    <label>លេខសម្ងាត់ (Password)</label>
                    <input type="password" id="password" placeholder="បញ្ចូលលេខសម្ងាត់...">
                </div>
                <button class="primary-btn" onclick="handleLogin()">ចូលកាន់ Dashboard</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="#" onclick="closeModal()" style="font-size: 12px; color: #8b949e; text-decoration: none;">បោះបង់</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // បើកផ្ទាំង Popup Account
        function openModal() {
            document.getElementById('authModal').classList.add('active');
        }

        // បិទផ្ទាំង Popup Account
        function closeModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        // จำลองการ Login สำเร็จ -> ប្តូរទៅ Dashboard Admin Panel
        function handleLogin() {
            const user = document.getElementById('username').value;
            if(user.trim() === "") {
                alert("សូមបញ្ចូលឈ្មោះគណនីរបស់អ្នក!");
                return;
            }
            closeModal();
            // លាក់ផ្ទាំងដើម និងបង្ហាញ Admin Dashboard
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('dashboardView').classList.add('active');
        }

        // មុខងារចាកចេញពី Dashboard
        function logout() {
            document.getElementById('dashboardView').classList.remove('active');
            document.getElementById('homeView').style.display = 'flex';
        }
    </script>
</body>
</html>
