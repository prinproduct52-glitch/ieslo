<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAISENTZ TOPUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #ff0055; /* ពណ៌លេចធ្លោសម្រាប់ប៊ូតុង */
        }
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-light); 
            padding-bottom: 80px;
        }
        
        /* Header */
        .header { 
            background: var(--bg-color); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-bottom: 1px solid #333;
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .header img {
            height: 40px;
            margin-right: 12px;
        }
        .header h1 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700; 
            color: var(--primary); 
            letter-spacing: 1px;
        }
        
        /* ហ្គេម (Categories) */
        .categories { 
            display: flex; 
            overflow-x: auto; 
            padding: 15px; 
            background: var(--bg-color); 
            gap: 10px; 
            border-bottom: 1px solid #333;
        }
        .categories::-webkit-scrollbar { display: none; }
        .category { 
            padding: 8px 20px; 
            background: var(--card-bg); 
            border: 1px solid #333;
            border-radius: 20px; 
            white-space: nowrap; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .category.active { 
            background: var(--primary); 
            color: #000; 
            border-color: var(--primary);
        }
        
        /* បញ្ជីសេវាកម្ម (Topup Packages) */
        .menu-container { 
            padding: 15px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
        }
        .menu-item { 
            background: var(--card-bg); 
            border-radius: 12px; 
            border: 1px solid #333;
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transition: transform 0.2s;
        }
        .menu-item:active { transform: scale(0.98); }
        .package-icon {
            font-size: 40px;
            text-align: center;
            padding: 20px 0;
            background: #222;
        }
        .item-info { 
            padding: 12px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }
        .item-title { font-size: 16px; margin: 0 0 5px; font-weight: 700; }
        .item-price { color: var(--accent); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
        .add-btn { 
            background: transparent; 
            color: var(--primary); 
            border: 1px solid var(--primary); 
            padding: 8px; 
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        .add-btn:active { background: var(--primary); color: #000; }
        
        /* កន្ត្រកទំនិញ (Cart Bottom Bar) */
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: var(--card-bg); 
            padding: 15px 20px; 
            box-sizing: border-box; 
            border-top: 1px solid #333;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .cart-bar.show { transform: translateY(0); }
        .cart-total { display: flex; flex-direction: column; }
        .cart-total span { font-size: 12px; color: var(--text-muted); }
        .cart-total strong { color: var(--accent); font-size: 18px; }
        .checkout-btn { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 25px; 
            font-weight: 700; 
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="image.png" alt="KAISENTZ TOPUP Logo">
        <h1>KAISENTZ</h1>
    </div>
    
    <div class="categories">
        <div class="category active">Mobile Legends</div>
        <div class="category">PUBG Mobile</div>
        <div class="category">Free Fire</div>
        <div class="category">Valorant</div>
    </div>

    <div class="menu-container" id="menuList">
        <!-- ទិន្នន័យ Topup នឹងត្រូវ Render ទីនេះ -->
    </div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-total">
            <span>តម្លៃសរុប:</span>
            <strong id="totalPrice">$0.00</strong>
        </div>
        <button class="checkout-btn" onclick="checkout()">
            បញ្ជាក់ការទិញ (<span id="cartCount">0</span>)
        </button>
    </div>

    <script>
        // ទិន្នន័យកញ្ចប់ Topup (Mock Data)
        const products = [
            { id: 1, name: '86 Diamonds', price: 1.00, icon: '💎' },
            { id: 2, name: '172 Diamonds', price: 2.00, icon: '💎' },
            { id: 3, name: '257 Diamonds', price: 3.00, icon: '💎' },
            { id: 4, name: '706 Diamonds', price: 8.00, icon: '💎' },
            { id: 5, name: 'Weekly Pass', price: 1.80, icon: '🎟️' },
            { id: 6, name: 'Twilight Pass', price: 9.50, icon: '🌟' }
        ];

        let cart = [];

        // បង្ហាញបញ្ជី Topup
        function renderMenu() {
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';
            products.forEach(p => {
                menuList.innerHTML += `
                    <div class="menu-item">
                        <div class="package-icon">${p.icon}</div>
                        <div class="item-info">
                            <h3 class="item-title">${p.name}</h3>
                            <div class="item-price">$${p.price.toFixed(2)}</div>
                            <button class="add-btn" onclick="addToCart(${p.id})">ជ្រើសរើស</button>
                        </div>
                    </div>
                `;
            });
        }

        // បន្ថែមចូលកន្ត្រក
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
        }

        // ធ្វើបច្ចុប្បន្នភាពកន្ត្រក
        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            document.getElementById('cartCount').innerText = cart.length;
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;

            if(cart.length > 0) {
                cartBar.classList.add('show');
            } else {
                cartBar.classList.remove('show');
            }
        }

        // បញ្ជាក់ការទិញ
        function checkout() {
            if(cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            alert(`✅ ការបញ្ជាទិញទទួលបានជោគជ័យ!\nសរុបទឹកប្រាក់: $${total.toFixed(2)}\n\nសូមរង់ចាំការបញ្ចូលពេជ្រពី Admin!`);
            
            cart = [];
            updateCartUI();
        }

        renderMenu();
    </script>
</body>
</html>
