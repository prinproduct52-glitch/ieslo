<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGit - បង្កើត និងដំណើរការ Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Kantumruy Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .repo-card {
            background: #151c2c;
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.25s ease;
        }
        .repo-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 8px 20px -5px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- របារខាងលើ (Navbar) -->
    <nav class="glass-nav sticky top-0 z-40 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-brands fa-github-alt text-white text-xl"></i>
                </div>
                <div>
                    <span class="text-lg font-bold text-white">MiniGit</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full ml-1">APP STUDIO</span>
                </div>
            </div>

            <div class="relative flex-1 max-w-xs">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-gray-400 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="filterApps()" placeholder="ស្វែងរក Mini App..." 
                    class="w-full bg-[#1e293b]/80 border border-gray-700 rounded-xl pl-9 pr-3 py-1.5 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                <button onclick="openCreateModal()" class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg shadow-blue-600/20 flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>បង្កើត Mini App ថ្មី</span>
                </button>
                <button onclick="clearAllApps()" id="clearAllBtn" class="hidden bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs px-3 py-2.5 rounded-xl transition" title="លុបទាំងអស់">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- បញ្ជី Mini Apps -->
    <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-1">
        <div id="appGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Mini Apps នឹងបង្ហាញនៅទីនេះ -->
        </div>
    </main>

    <!-- ផ្ទាំងបង្កើត Mini App ថ្មី (Create Modal) -->
    <div id="createModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#151c2c] border border-gray-700 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center px-5 py-4 border-b border-gray-800">
                <h3 class="font-bold text-base text-white flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-blue-400"></i>
                    <span>បង្កើត Mini App ថ្មី</span>
                </h3>
                <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="saveMiniApp(event)" class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">ឈ្មោះ Mini App *</label>
                    <input type="text" id="appName" required placeholder="ឧ. ម៉ាស៊ីនគិតលេខ, ហ្គេមខ្លី..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">ការពិពណ៌នាខ្លី *</label>
                    <input type="text" id="appDesc" required placeholder="រៀបរាប់ខ្លីៗពីមុខងាររបស់ App..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs text-gray-400">កូដកម្មវិធី (HTML / CSS / JS) *</label>
                        <button type="button" onclick="insertTemplate()" class="text-[11px] text-blue-400 hover:underline">
                            + ដាក់កូដគំរូសាកល្បង
                        </button>
                    </div>
                    <textarea id="appCode" required rows="8" placeholder="សរសេរ ឬ Paste កូដ HTML/CSS/JS នៅទីនេះ..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl p-3 text-xs font-mono text-cyan-300 focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2 rounded-xl text-xs text-gray-400 hover:bg-gray-800">បោះបង់</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-5 py-2 rounded-xl shadow-lg shadow-blue-600/30">បង្កើត និងរក្សាទុក</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ផ្ទាំងដំណើរការ Mini App និងមើលកូដ (Runner & Code Modal) -->
    <div id="runnerModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center z-50 p-3 sm:p-6">
        <div class="bg-[#151c2c] border border-gray-700 rounded-2xl max-w-4xl w-full h-[85vh] flex flex-col overflow-hidden shadow-2xl">
            <!-- Header -->
            <div class="flex justify-between items-center px-5 py-3.5 border-b border-gray-800 bg-[#0f172a]">
                <div class="flex items-center space-x-2.5">
                    <span class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></span>
                    <h3 id="runnerTitle" class="font-bold text-sm sm:text-base text-white truncate">ឈ្មោះ App</h3>
                </div>
                
                <!-- ប៊ូតុងប្ដូរផ្ទាំង (Preview vs Code) -->
                <div class="flex items-center space-x-2">
                    <div class="bg-[#1e293b] p-1 rounded-xl flex space-x-1">
                        <button onclick="switchTab('preview')" id="tabPreviewBtn" class="px-3 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white transition">
                            <i class="fa-solid fa-play mr-1"></i> ដំណើរការ App
                        </button>
                        <button onclick="switchTab('code')" id="tabCodeBtn" class="px-3 py-1 rounded-lg text-xs font-medium text-gray-400 hover:text-white transition">
                            <i class="fa-solid fa-code mr-1"></i> មើលកូដ
                        </button>
                    </div>
                    <button onclick="closeRunnerModal()" class="text-gray-400 hover:text-white px-2">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- ផ្ទាំងបង្ហាញដំណើរការ App ផ្ទាល់ (Iframe Sandbox) -->
            <div id="previewPane" class="flex-1 bg-white w-full h-full relative">
                <iframe id="appIframe" class="w-full h-full border-0" sandbox="allow-scripts allow-forms allow-modals"></iframe>
            </div>

            <!-- ផ្ទាំងបង្ហាញកូដ (Code View) -->
            <div id="codePane" class="hidden flex-1 bg-[#0b0f19] p-4 overflow-y-auto flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-800">
                        <span class="text-xs text-gray-400 font-mono">index.html</span>
                        <button onclick="copyAppCode()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1 rounded-lg">
                            <i class="fa-regular fa-copy mr-1"></i> <span id="copyText">ចម្លងកូដ</span>
                        </button>
                    </div>
                    <pre class="text-xs font-mono text-cyan-300 overflow-x-auto whitespace-pre-wrap"><code id="runnerCodeDisplay"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ទាញយកទិន្នន័យពី LocalStorage (ចាប់ផ្ដើមដោយទទេស្អាត គ្មាន Repo ចាស់ៗទេ)
        let miniApps = JSON.parse(localStorage.getItem('minigit_apps')) || [];

        function saveToStorage() {
            localStorage.setItem('minigit_apps', JSON.stringify(miniApps));
        }

        // បង្ហាញបញ្ជី Mini Apps
        function renderApps(list = miniApps) {
            const grid = document.getElementById('appGrid');
            const clearBtn = document.getElementById('clearAllBtn');
            grid.innerHTML = '';

            if (miniApps.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 px-4 text-center border border-dashed border-gray-800 rounded-2xl bg-[#151c2c]/40">
                        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-2xl mb-4">
                            <i class="fa-solid fa-cubes"></i>
                        </div>
                        <h3 class="text-base font-bold text-white mb-1">មិនទាន់មាន Mini App នៅឡើយទេ</h3>
                        <p class="text-xs text-gray-400 max-w-sm mb-5">Repository ចាស់ៗត្រូវបានលុបអស់ហើយ។ អ្នកអាចចាប់ផ្ដើមបង្កើត Mini App ផ្ទាល់ខ្លួនរបស់អ្នកឥឡូវនេះ!</p>
                        <button onclick="openCreateModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-blue-600/20 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-plus"></i>
                            <span>បង្កើត Mini App ដំបូង</span>
                        </button>
                    </div>
                `;
                return;
            }

            list.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = 'repo-card rounded-2xl p-5 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500/20 to-cyan-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400">
                                    <i class="fa-solid fa-rocket text-sm"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white text-sm sm:text-base">${app.name}</h3>
                                    <span class="text-[10px] text-gray-500">${app.createdAt}</span>
                                </div>
                            </div>
                            <button onclick="deleteApp(${app.id})" class="text-gray-500 hover:text-red-400 p-1.5 transition" title="លុប App នេះ">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                        <p class="text-gray-400 text-xs leading-relaxed mb-5">${app.description}</p>
                    </div>

                    <div class="flex space-x-2 pt-3 border-t border-gray-800/80">
                        <button onclick="launchApp(${app.id}, 'preview')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-2.5 rounded-xl transition flex items-center justify-center space-x-1.5 shadow-lg shadow-blue-600/20">
                            <i class="fa-solid fa-play text-[10px]"></i>
                            <span>បើកដំណើរការ App</span>
                        </button>
                        <button onclick="launchApp(${app.id}, 'code')" class="bg-[#1e293b] hover:bg-gray-700 text-gray-300 text-xs font-medium px-3.5 py-2.5 rounded-xl transition" title="មើលកូដ">
                            <i class="fa-solid fa-code"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // បន្ថែម Mini App ថ្មី
        function saveMiniApp(e) {
            e.preventDefault();
            const name = document.getElementById('appName').value.trim();
            const desc = document.getElementById('appDesc').value.trim();
            const code = document.getElementById('appCode').value;

            const newApp = {
                id: Date.now(),
                name: name,
                description: desc,
                code: code,
                createdAt: new Date().toLocaleTimeString('km-KH', { hour: '2-digit', minute: '2-digit' })
            };

            miniApps.unshift(newApp);
            saveToStorage();
            renderApps();
            closeCreateModal();
            e.target.reset();
        }

        // ដាក់កូដគំរូសម្រាប់សាកល្បងរហ័ស
        function insertTemplate() {
            document.getElementById('appName').value = "កម្មវិធីរាប់លេខ (Counter App)";
            document.getElementById('appDesc').value = "Mini App សម្រាប់ចុចរាប់ចំនួន មានពណ៌ស្រស់ស្អាត។";
            document.getElementById('appCode').value = `<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; background: #0f172a; color: white; margin: 0; }
  .box { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
  h1 { font-size: 56px; margin: 15px 0; color: #38bdf8; }
  button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 5px; }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="box">
    <h2>កម្មវិធីរាប់លេខ</h2>
    <h1 id="count">0</h1>
    <button onclick="change(-1)">- បន្ថយ</button>
    <button onclick="change(1)">+ បន្ថែម</button>
  </div>
  <script>
    let c = 0;
    function change(v) { c += v; document.getElementById('count').innerText = c; }
  <\/script>
</body>
</html>`;
        }

        // បើកដំណើរការ Mini App
        function launchApp(id, mode) {
            const app = miniApps.find(a => a.id === id);
            if (!app) return;

            document.getElementById('runnerTitle').innerText = app.name;
            document.getElementById('runnerCodeDisplay').innerText = app.code;

            // បញ្ចូលកូដទៅក្នុង Iframe ដើម្បីឱ្យ App ដំណើរការផ្ទាល់
            const iframe = document.getElementById('appIframe');
            iframe.srcdoc = app.code;

            const modal = document.getElementById('runnerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            switchTab(mode);
        }

        function switchTab(tab) {
            const previewPane = document.getElementById('previewPane');
            const codePane = document.getElementById('codePane');
            const btnPreview = document.getElementById('tabPreviewBtn');
            const btnCode = document.getElementById('tabCodeBtn');

            if (tab === 'preview') {
                previewPane.classList.remove('hidden');
                codePane.classList.add('hidden');
                btnPreview.className = "px-3 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white transition";
                btnCode.className = "px-3 py-1 rounded-lg text-xs font-medium text-gray-400 hover:text-white transition";
            } else {
                previewPane.classList.add('hidden');
                codePane.classList.remove('hidden');
                codePane.classList.add('flex');
                btnCode.className = "px-3 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white transition";
                btnPreview.className = "px-3 py-1 rounded-lg text-xs font-medium text-gray-400 hover:text-white transition";
            }
        }

        // លុប Mini App មួយៗ
        function deleteApp(id) {
            if (confirm('តើអ្នកពិតជាចង់លុប Mini App នេះមែនទេ?')) {
                miniApps = miniApps.filter(a => a.id !== id);
                saveToStorage();
                renderApps();
            }
        }

        // លុប Mini App ទាំងអស់
        function clearAllApps() {
            if (confirm('តើអ្នកចង់លុប Mini App ទាំងអស់ចេញពីបញ្ជីមែនទេ?')) {
                miniApps = [];
                saveToStorage();
                renderApps();
            }
        }

        // ស្វែងរក Mini App
        function filterApps() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = miniApps.filter(a => 
                a.name.toLowerCase().includes(q) || 
                a.description.toLowerCase().includes(q)
            );
            renderApps(filtered);
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.remove('hidden');
            document.getElementById('createModal').classList.add('flex');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('createModal').classList.remove('flex');
        }

        function closeRunnerModal() {
            document.getElementById('runnerModal').classList.add('hidden');
            document.getElementById('runnerModal').classList.remove('flex');
            document.getElementById('appIframe').srcdoc = '';
        }

        function copyAppCode() {
            const code = document.getElementById('runnerCodeDisplay').innerText;
            navigator.clipboard.writeText(code);
            document.getElementById('copyText').innerText = "បានចម្លង ✓";
            setTimeout(() => { document.getElementById('copyText').innerText = "ចម្លងកូដ"; }, 2000);
        }

        // បង្ហាញផ្ទាំងដំបូង
        renderApps();
    </script>
</body>
</html>
